    <!-- 🔥 Loader styles -->
    <style>
      body {
        margin: 0;
        background: #0f0f23;
        height: 100vh;
        overflow: hidden;
      }
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0f0f23;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        z-index: 9999;
        animation: float 3s ease-in-out infinite;
      }

      /* Спиннер */
      .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(99, 102, 241, 0.3);
        border-top: 5px solid #6366f1;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Текст */
      .loader {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 22px;
        font-weight: 500;
        position: relative;
        font-family: "Poppins", sans-serif;
        color: #7c7c7c;
      }

      .words {
        overflow: hidden;
        height: 25px;
        position: relative;
      }
      .word {
        display: block;
        height: 25px;
        color: #956afa;
        animation: spinwords 4s infinite;
      }
      @keyframes spinwords {
        10% {
          transform: translateY(-25px);
        }
        25% {
          transform: translateY(-25px);
        }
        35% {
          transform: translateY(-50px);
        }
        50% {
          transform: translateY(-50px);
        }
        60% {
          transform: translateY(-75px);
        }
        75% {
          transform: translateY(-75px);
        }
        85% {
          transform: translateY(-100px);
        }
        100% {
          transform: translateY(-100px);
        }
      }

      /* Точки */
      .loading-dots {
        display: flex;
        gap: 5px;
      }
      .dot {
        width: 10px;
        height: 10px;
        background: #6366f1;
        border-radius: 50%;
        animation: bounce 1.5s infinite ease-in-out;
      }
      .dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dot:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }

      /* Плавное исчезновение */
      .fade-out {
        opacity: 0;
        transition: opacity 0.5s ease;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }
    </style>
  </head>
  <body>
    <!-- 🚀 Initial Loader -->
    <div id="initial-loader">
      <div class="spinner"></div>
      <div class="loader">
        <p>Saytdagi</p>
        <div class="words">
          <span class="word">buttons</span>
          <span class="word">texts</span>
          <span class="word">images</span>
          <span class="word">cards</span>
          <span class="word">buttons</span>
        </div>
        <p>yuklanyapti</p>
      </div>
      <div class="loading-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <!-- React root -->
    <div id="root" style="display:none"></div>

    <!-- React bundle -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- 🔥 Hide loader only after all is loaded -->
    <script>
      window.addEventListener("load", () => {
        const loader = document.getElementById("initial-loader");
        const root = document.getElementById("root");

        if (loader && root) {
          loader.classList.add("fade-out");
          setTimeout(() => {
            loader.style.display = "none";
            root.style.display = "block";
            document.body.style.overflow = "auto";
          }, 500);
        }
      });
    </script>
  </body>
</html>
